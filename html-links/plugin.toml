schema = 1
id = "html-links"
name = "HTML links"
version = "0.5.0"
description = "Every local .html file opens as the rendered page in a browser pane beside its opener pane: clicks, the Files pane, `tern open`, bin/open and `open -a Tern`. Other file:// links open the file in Tern. A web link that Tern opens stays in Tern only when it goes to this machine, and other web links open in Microsoft Edge. Cmd+R reloads the page, or refreshes the active SQLite view (Execute runs its SQL)."
window = "window.luau"
